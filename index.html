<style>

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}

  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .search{
    width:100%;margin:6px 0 14px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--fg);font:inherit;font-size:14px;outline:none
  }
  .search::placeholder{color:#5f6977}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{
    flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--dim);font-size:13.5px;font-weight:650;cursor:pointer

  .sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
  .sec-h h2{font-size:15px;margin:0;font-weight:750}
  .sec-h .n{font-size:11px;color:var(--dim)}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));

  .rank{

  .rank.T1{background:linear-gradient(160deg,#b06bd8,#6a2f9a);color:#fff}
  .rank.T2{background:linear-gradient(160deg,#4f8bd8,#26528f);color:#fff}

  .tier .nm{font-weight:700;font-size:14px}
  .tier .ds{color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.55}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:1px}

  .tag.easy{color:#5ce0a0;border-color:rgba(92,224,160,.35)}
  .tag.hard{color:#ff8b8d;border-color:rgba(255,100,100,.35)}

  .mx-row.h > div{background:transparent;border:0;color:var(--dim);font-size:10px;letter-spacing:.04em;padding:0 2px 3px}
  /* 最优搭配 */

  .best-2 li{font-size:11.5px;color:#cfd6df;line-height:1.6}
  .ver{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:999px;
    border:1px solid rgba(232,179,61,.35);color:#ffe0a3;background:rgba(232,179,61,.10);vertical-align:2px}
  .chg{border-left:2px solid rgba(232,179,61,.35);padding-left:12px;margin-left:4px}

  .chg .d{color:var(--dim);font-size:11px;margin-left:6px}
  .chg .t{font-size:12.5px;color:#cfd6df;line-height:1.6;margin:2px 0 12px}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

  .taglist.hot span{border-color:rgba(226,87,76,.4);color:#ffb4b6;background:rgba(226,87,76,.08)}
  .taglist.safe span{border-color:rgba(92,224,160,.32);color:#9be6bf;background:rgba(92,224,160,.06)}

/* ═══════════ 渲染 ═══════════ */
const $ = (s) => document.querySelector(s)
let tab = 'gun'
let q = ''

function hl(text) {
  if (!q) return text
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig')
  return text.replace(re, '<mark style="background:rgba(232,179,61,.35);color:#fff;border-radius:3px;padding:0 2px">$1</mark>')
}

function renderGun() {
  const kw = q.trim().toLowerCase()
  const out = []

  out.push('<div class="sec"><div class="sec-h"><h2>枪械强度排名</h2><span class="n">综合易用性 + 上限</span></div>')
  for (const tier of TIERS) {
    const items = tier.items.filter((i) => !kw || i.n.toLowerCase().includes(kw) || i.d.toLowerCase().includes(kw))
    if (!items.length) continue
    out.push(`<div class="card" style="padding:6px 14px"><div class="tier"><div class="rank ${tier.t}">${tier.t}</div><div class="body"><div class="nm">${tier.title}</div></div></div>`)
    for (const i of items) {
      out.push(`<div class="tier">
        <div class="rank ${tier.t}" style="visibility:hidden">${tier.t}</div>
        <div class="body">
          <div class="nm">${hl(i.n)}${i.tag.includes('crate') ? '<span class="tag crate">空投</span>' : ''}${i.tag.includes('easy') ? '<span class="tag easy">好上手</span>' : ''}${i.tag.includes('hard') ? '<span class="tag hard">要练</span>' : ''}</div>
          <div class="ds">${hl(i.d)}</div>
        </div>
      </div>`)
    }
    out.push('</div>')
  }
  out.push('</div>')

  // 结论先行：最优搭配 + 场景配装（只在没搜索时显示，避免干扰搜索结果）
  if (!kw) {
    out.push(renderBest())
    out.push(renderScenarios())
  }

  const atts = ATTACH.filter((a) => !kw || a.n.toLowerCase().includes(kw) || a.d.toLowerCase().includes(kw))
  if (atts.length) {
    out.push('<div class="sec"><div class="sec-h"><h2>配件怎么选</h2><span class="n">优先级从高到低</span></div><div class="card">')
    for (const a of atts) out.push(`<div class="att"><div class="n">${hl(a.n)}</div><div class="d">${hl(a.d).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div></div>`)
    out.push('</div></div>')
  }

  const combos = COMBOS.filter((c) => !kw || c.n.toLowerCase().includes(kw) || c.d.toLowerCase().includes(kw))
  if (combos.length) {
    out.push('<div class="sec"><div class="sec-h"><h2>两把枪怎么搭</h2><span class="n">按打法定</span></div><div class="card">')
    for (const c of combos) out.push(`<div class="att" style="grid-template-columns:1fr"><div class="n">${hl(c.n)}</div><div class="d">${hl(c.d).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div></div>`)
    out.push('</div></div>')
  }

  if (!out.length) return '<div class="empty">没找到相关枪械，换个关键词试试</div>'
  return out.join('')
}

/* 当前版本最优搭配 */

  const b = BEST
  return `<div class="sec">
    <div class="sec-h"><h2>当前版本最优搭配</h2><span class="n">${META.version} 综合结论</span></div>
    <div class="card" style="border-color:rgba(232,179,61,.3)">
      <div class="best-2">
        <div>
          <div class="nm">主武器 · ${b.main}</div>
          <ul>${b.mainAtt.map((x) => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="nm">副武器 · ${b.sub}</div>
          <ul>${b.subAtt.map((x) => `<li>${x}</li>`).join('')}</ul>
        </div>
      </div>
      <ul class="tips">${b.why.map((w) => `<li>${w.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`).join('')}</ul>
      <div class="note"><b>备选：</b>${b.alt.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div>
      <div class="note" style="border-style:solid"><b>配套背包：</b>${b.kit.join(' · ')}</div>
    </div>
  </div>`
}

/* 场景 × 配件 矩阵 + 五个场景的具体配装 */
function renderScenarios() {
  const head = `<div class="mx-row h"><div></div>${MATRIX.head.map((h) => `<div>${h}</div>`).join('')}</div>`
  const rows = MATRIX.rows
    .map((r) => `<div class="mx-row"><div class="k">${r[0]}</div>${r.slice(1).map((c) => `<div>${c}</div>`).join('')}</div>`)
    .join('')

  const cards = SCEN.map((s) => `<div class="att" style="grid-template-columns:1fr;padding:12px 0">
      <div class="n">${s.n}</div>
      <div class="d" style="color:#cfd6df;margin-top:2px"><b style="color:#ffe0a3">主武器：</b>${s.w}</div>
      <div class="d" style="margin-top:5px">${s.att.map((a) => '· ' + a).join('<br>')}</div>
      <div class="d" style="margin-top:6px;color:#9aa4b2">${s.why.replace(/\*\*(.+?)\*\*/g, '<b style="color:#ffe0a3">$1</b>')}</div>
    </div>`).join('')

  return `<div class="sec">
    <div class="sec-h"><h2>不同场景 · 配件怎么变</h2><span class="n">同样的枪，配件完全不同</span></div>
    <div class="card">
      <div class="mx">${head}${rows}</div>
      <div class="note">同一个配件在不同距离下的价值完全不一样：贴脸看开镜速度和腰射，中距看垂直后坐，远距看准心稳定。<b>不存在一套搭配通吃所有距离</b>。</div>
    </div>
    <div class="card">${cards}</div>
  </div>`
}

/* 版本页 */
function renderVersion() {
  return `<div class="sec">
    <div class="sec-h"><h2>适用版本</h2><span class="n">${META.updatedAt} 更新</span></div>
    <div class="card">
      <div style="font-size:22px;font-weight:800;color:#ffe0a3">${META.version}</div>
      <div class="stats" style="margin-top:6px">${META.note}</div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2>更新记录</h2><span class="n">${META.changelog.length} 条</span></div>
    <div class="card">
      <div class="chg">
        ${META.changelog.map((c) => `<div><span class="v">${c.v}</span><span class="d">${c.d}</span><div class="t">${c.t}</div></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="sec">
    <div class="sec-h"><h2>怎么更新</h2></div>
    <div class="card">
      <ul class="tips">
        <li>PUBG 每次大版本（通常每 2–3 个月一次大改）会调整枪械数值与配件效果，<b>强度排名会有浮动</b>。</li>
        <li>这份手册的数据写在页面里，更新时我会改对应的条目、改版本号、记一条更新记录。</li>
        <li>你发现哪条和游戏里对不上，告诉我「版本号 + 现象」，我核对后改。</li>
        <li>小改动（个别枪加强/削弱）我直接改；大改动（后坐力系统、配件机制变化）会整章重写。</li>
      </ul>
    </div>
  </div>`
}

/* 地图页 */
function renderMap() {
  const kw = q.trim().toLowerCase()
  const out = []
  for (const m of MAPS) {
    const hay = (m.n + m.sub + m.terrain + m.car + m.hot.join() + m.safe.join() + m.tips.join()).toLowerCase()
    if (kw && !hay.includes(kw)) continue
    out.push(`<div class="sec">
      <div class="sec-h"><h2>${m.n}</h2></div>
      <div class="card">
        <div class="stats" style="margin:0 0 10px;color:#cfd6df">${m.sub}</div>

        <div class="pv-title" style="margin-top:6px">热门跳点 · 人多枪战多</div>
        <div class="taglist hot">${m.hot.map((x) => `<span>${x}</span>`).join('')}</div>

        <div class="pv-title" style="margin-top:14px">新手推荐落点 · 发育稳</div>
        <div class="taglist safe">${m.safe.map((x) => `<span>${x}</span>`).join('')}</div>

        <div class="pv-title" style="margin-top:14px">地形特点</div>
        <div class="stats" style="margin:0">${m.terrain.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div>

        <div class="pv-title" style="margin-top:14px">载具</div>
        <div class="stats" style="margin:0">${m.car}</div>

        <div class="pv-title" style="margin-top:14px">这张图的打法要点</div>
        <ul class="tips">${m.tips.map((t) => `<li>${t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`).join('')}</ul>
      </div>
    </div>`)
  }
  if (!out.length) return '<div class="empty">没找到相关地图内容</div>'
  return out.join('')
}

function renderTip() {
  const kw = q.trim().toLowerCase()
  const out = []
  for (const sec of TIPS) {
    const items = sec.items.filter((i) => !kw || i.toLowerCase().includes(kw))
    if (!items.length) continue
    out.push(`<div class="sec"><div class="sec-h"><h2>${sec.h}</h2><span class="n">${items.length} 条</span></div><div class="card"><ul class="tips">`)
    for (const i of items) {
      const html = hl(i).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      out.push(`<li>${html}</li>`)
    }
    out.push('</ul></div></div>')
  }
  if (!out.length) return '<div class="empty">没找到相关小知识</div>'
  return out.join('')
}

function render() {
  if (tab === 'gun') $('#view').innerHTML = renderGun()
  else if (tab === 'tip') $('#view').innerHTML = renderTip()
  else if (tab === 'map') $('#view').innerHTML = renderMap()
  else $('#view').innerHTML = renderVersion()
}

$('#ver').textContent = `${META.version} · ${META.updatedAt}`

document.querySelectorAll('.tab').forEach((el) => el.addEventListener('click', () => {
  tab = el.dataset.tab
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === el))
  render()
}))

$('#q').addEventListener('input', (e) => { q = e.target.value; render() })

render()

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
