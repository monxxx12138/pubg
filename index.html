function hl(text) {
  if (!q) return text
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig')
  return text.replace(re, '<mark style="background:rgba(232,179,61,.35);color:#fff;border-radius:3px;padding:0 2px">$1</mark>')
}

function renderGun() {
  const kw = q.trim().toLowerCase()
  const out = []

  out.push('<div class="sec"><div class="sec-h"><h2>枪械强度排名</h2><span class="n">综合易用性 + 上限</span></div>')
  for (const tier of TIERS) {
    const items = tier.items.filter((i) => !kw || i.n.toLowerCase().includes(kw) || i.d.toLowerCase().includes(kw))
    if (!items.length) continue
    out.push(`<div class="card" style="padding:6px 14px"><div class="tier"><div class="rank ${tier.t}">${tier.t}</div><div class="body"><div class="nm">${tier.title}</div></div></div>`)
    for (const i of items) {
      out.push(`<div class="tier">
        <div class="rank ${tier.t}" style="visibility:hidden">${tier.t}</div>
        <div class="body">
          <div class="nm">${hl(i.n)}${i.tag.includes('crate') ? '<span class="tag crate">空投</span>' : ''}${i.tag.includes('easy') ? '<span class="tag easy">好上手</span>' : ''}${i.tag.includes('hard') ? '<span class="tag hard">要练</span>' : ''}</div>
          <div class="ds">${hl(i.d)}</div>
        </div>
      </div>`)
    }
    out.push('</div>')
  }
  out.push('</div>')

  const atts = ATTACH.filter((a) => !kw || a.n.toLowerCase().includes(kw) || a.d.toLowerCase().includes(kw))
  if (atts.length) {
    out.push('<div class="sec"><div class="sec-h"><h2>配件怎么选</h2><span class="n">优先级从高到低</span></div><div class="card">')
    for (const a of atts) out.push(`<div class="att"><div class="n">${hl(a.n)}</div><div class="d">${hl(a.d).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div></div>`)
    out.push('</div></div>')
  }

  const combos = COMBOS.filter((c) => !kw || c.n.toLowerCase().includes(kw) || c.d.toLowerCase().includes(kw))
  if (combos.length) {
    out.push('<div class="sec"><div class="sec-h"><h2>两把枪怎么搭</h2><span class="n">按打法定</span></div><div class="card">')
    for (const c of combos) out.push(`<div class="att" style="grid-template-columns:1fr"><div class="n">${hl(c.n)}</div><div class="d">${hl(c.d).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div></div>`)
    out.push('</div></div>')
  }

  if (!out.length) return '<div class="empty">没找到相关枪械，换个关键词试试</div>'
  return out.join('')
}

function renderTip() {
  const kw = q.trim().toLowerCase()
  const out = []
  for (const sec of TIPS) {
    const items = sec.items.filter((i) => !kw || i.toLowerCase().includes(kw))
    if (!items.length) continue
    out.push(`<div class="sec"><div class="sec-h"><h2>${sec.h}</h2><span class="n">${items.length} 条</span></div><div class="card"><ul class="tips">`)
    for (const i of items) {
      const html = hl(i).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      out.push(`<li>${html}</li>`)
    }
    out.push('</ul></div></div>')
  }
  if (!out.length) return '<div class="empty">没找到相关小知识</div>'
  return out.join('')
}

function render() {
  $('#view').innerHTML = tab === 'gun' ? renderGun() : renderTip()
}

document.querySelectorAll('.tab').forEach((el) => el.addEventListener('click', () => {
  tab = el.dataset.tab
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === el))
  render()
}))

$('#q').addEventListener('input', (e) => { q = e.target.value; render() })

render()

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
</script>
</body>
</html>
